name: "UDDI - VPC Deployment"

on:
  workflow_dispatch:
    inputs:
      network_name:
        description: "VPC/VNet base name (used for resource naming across clouds)"
        required: true
        type: string
        default: "demo-vpc"
      subnet_size:
        description: "Subnet size as CIDR prefix length — smaller number = larger subnet (e.g., /24 = 256 IPs, /28 = 16 IPs)"
        required: true
        type: choice
        options:
          - "16"
          - "20"
          - "24"
          - "26"
          - "28"
        default: "24"
      vpc_count:
        description: "Number of VPCs/VNets to deploy per selected cloud"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"
      deploy_aws:
        description: "Deploy VPC to AWS (recommended for first demo)"
        required: true
        type: boolean
        default: true
      aws_region:
        description: "AWS Region for VPC deployment"
        required: false
        type: choice
        options:
          - "eu-central-1"
          - "us-east-1"
          - "us-west-2"
        default: "eu-central-1"
      deploy_azure:
        description: "Deploy VNet to Azure (adds multi-cloud story)"
        required: true
        type: boolean
        default: false
      azure_location:
        description: "Azure location for VNet deployment"
        required: false
        type: choice
        options:
          - "westeurope"
          - "eastus"
          - "westus2"
        default: "westeurope"
      deploy_gcp:
        description: "Deploy VPC to GCP (adds multi-cloud story)"
        required: true
        type: boolean
        default: false
      gcp_region:
        description: "GCP region for VPC deployment"
        required: false
        type: choice
        options:
          - "europe-west1"
          - "us-central1"
          - "us-west1"
        default: "europe-west1"
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - "apply"
          - "destroy"
        default: "apply"

env:
  TF_IN_AUTOMATION: "true"

jobs:
  preflight:
    name: "Preflight Checks"
    runs-on: ubuntu-latest
    outputs:
      deploy_count: ${{ steps.check.outputs.deploy_count }}
      clouds: ${{ steps.check.outputs.clouds }}
      total_networks: ${{ steps.check.outputs.total_networks }}
    steps:
      - name: Validate cloud selection
        id: check
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Preflight: Validating Cloud Selection & IPAM Config     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          DEPLOY_COUNT=0
          CLOUDS=""
          TOTAL_NETWORKS=0
          
          if [ "${{ inputs.deploy_aws }}" == "true" ]; then
            DEPLOY_COUNT=$((DEPLOY_COUNT + 1))
            CLOUDS="${CLOUDS}AWS(${{ inputs.vpc_count }}) "
            TOTAL_NETWORKS=$((TOTAL_NETWORKS + ${{ inputs.vpc_count }}))
          fi
          
          if [ "${{ inputs.deploy_azure }}" == "true" ]; then
            DEPLOY_COUNT=$((DEPLOY_COUNT + 1))
            CLOUDS="${CLOUDS}Azure(${{ inputs.vpc_count }}) "
            TOTAL_NETWORKS=$((TOTAL_NETWORKS + ${{ inputs.vpc_count }}))
          fi
          
          if [ "${{ inputs.deploy_gcp }}" == "true" ]; then
            DEPLOY_COUNT=$((DEPLOY_COUNT + 1))
            CLOUDS="${CLOUDS}GCP(${{ inputs.vpc_count }}) "
            TOTAL_NETWORKS=$((TOTAL_NETWORKS + ${{ inputs.vpc_count }}))
          fi
          
          if [ $DEPLOY_COUNT -eq 0 ]; then
            echo "❌ ERROR: No cloud provider selected!"
            exit 1
          fi
          
          echo "deploy_count=${DEPLOY_COUNT}" >> $GITHUB_OUTPUT
          echo "clouds=${CLOUDS}" >> $GITHUB_OUTPUT
          echo "total_networks=${TOTAL_NETWORKS}" >> $GITHUB_OUTPUT
          
          echo "✅ Deploying ${TOTAL_NETWORKS} total networks across ${DEPLOY_COUNT} cloud(s): ${CLOUDS}"

  aws_vpcs:
    name: "AWS VPCs"
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.deploy_aws == true }}
    environment: dev
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BLOCK_ID: ${{ secrets.AWS_BLOCK_ID }}
      IPAM_SPACE_ID: ${{ secrets.IPAM_SPACE_ID }}
    outputs:
      vpcs: ${{ steps.deploy.outputs.results }}
      verification: ${{ steps.verify.outputs.verification }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Restore Terraform state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            live/demos/vpc-aws/.terraform
            live/demos/vpc-aws/.terraform.lock.hcl
            live/demos/vpc-aws/terraform-*.tfstate
            live/demos/vpc-aws/terraform-*.tfstate.backup
          key: tfstate-vpc-aws-${{ inputs.network_name }}
          restore-keys: |
            tfstate-vpc-aws-

      - name: Deploy AWS VPCs
        id: deploy
        uses: ./.github/actions/deploy-network
        with:
          tf-dir: live/demos/vpc-aws
          cloud: aws
          emoji: "🟠"
          network-name: ${{ inputs.network_name }}
          count: ${{ inputs.vpc_count }}
          subnet-size: ${{ inputs.subnet_size }}
          name-var: vpc_name
          id-output: vpc_id
          cidr-output: vpc_cidr
          bloxone-host: ${{ env.BLOXONE_HOST }}
          bloxone-api-key: ${{ env.BLOXONE_API_KEY }}
          action: ${{ inputs.action }}
          extra-vars: |
            aws_region=${{ inputs.aws_region }}
            aws_block_id=${{ env.AWS_BLOCK_ID }}
            ipam_space_id=${{ env.IPAM_SPACE_ID }}

      - name: Save Terraform state cache
        if: ${{ inputs.action == 'apply' }}
        uses: actions/cache/save@v4
        with:
          path: |
            live/demos/vpc-aws/.terraform
            live/demos/vpc-aws/.terraform.lock.hcl
            live/demos/vpc-aws/terraform-*.tfstate
            live/demos/vpc-aws/terraform-*.tfstate.backup
          key: tfstate-vpc-aws-${{ inputs.network_name }}

      - name: Verify AWS VPCs
        if: ${{ inputs.action == 'apply' }}
        id: verify
        run: |
          echo '{"vpcs": [' > /tmp/aws_verification.json
          FIRST=true

          while IFS='|' read -r NAME VPC_ID CIDR; do
            [ -z "$NAME" ] && continue

            VPC_STATE=$(aws ec2 describe-vpcs \
              --region ${{ inputs.aws_region }} \
              --vpc-ids ${VPC_ID} \
              --query 'Vpcs[0].State' \
              --output text 2>/dev/null || echo "error")

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo ',' >> /tmp/aws_verification.json
            fi

            echo "{\"name\": \"${NAME}\", \"id\": \"${VPC_ID}\", \"cidr\": \"${CIDR}\", \"state\": \"${VPC_STATE}\"}" >> /tmp/aws_verification.json
          done < <(echo '${{ steps.deploy.outputs.results }}' | jq -r '.[]?')

          echo ']}' >> /tmp/aws_verification.json
          VERIFICATION=$(cat /tmp/aws_verification.json | jq -c .)
          echo "verification=${VERIFICATION}" >> $GITHUB_OUTPUT

  azure_vnets:
    name: "Azure VNets"
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.deploy_azure == true }}
    environment: dev
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AZURE_BLOCK_ID: ${{ secrets.AZURE_BLOCK_ID }}
      IPAM_SPACE_ID: ${{ secrets.IPAM_SPACE_ID }}
    outputs:
      vnets: ${{ steps.deploy.outputs.results }}
      verification: ${{ steps.verify.outputs.verification }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Restore Terraform state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            live/demos/vpc-azure/.terraform
            live/demos/vpc-azure/.terraform.lock.hcl
            live/demos/vpc-azure/terraform-*.tfstate
            live/demos/vpc-azure/terraform-*.tfstate.backup
          key: tfstate-vpc-azure-${{ inputs.network_name }}
          restore-keys: |
            tfstate-vpc-azure-

      - name: Deploy Azure VNets
        id: deploy
        uses: ./.github/actions/deploy-network
        with:
          tf-dir: live/demos/vpc-azure
          cloud: azure
          emoji: "🔵"
          network-name: ${{ inputs.network_name }}
          count: ${{ inputs.vpc_count }}
          subnet-size: ${{ inputs.subnet_size }}
          name-var: vnet_name
          id-output: vnet_id
          cidr-output: vnet_cidr
          bloxone-host: ${{ env.BLOXONE_HOST }}
          bloxone-api-key: ${{ env.BLOXONE_API_KEY }}
          action: ${{ inputs.action }}
          extra-vars: |
            azure_location=${{ inputs.azure_location }}
            azure_block_id=${{ env.AZURE_BLOCK_ID }}
            ipam_space_id=${{ env.IPAM_SPACE_ID }}

      - name: Save Terraform state cache
        if: ${{ inputs.action == 'apply' }}
        uses: actions/cache/save@v4
        with:
          path: |
            live/demos/vpc-azure/.terraform
            live/demos/vpc-azure/.terraform.lock.hcl
            live/demos/vpc-azure/terraform-*.tfstate
            live/demos/vpc-azure/terraform-*.tfstate.backup
          key: tfstate-vpc-azure-${{ inputs.network_name }}

      - name: Verify Azure VNets
        if: ${{ inputs.action == 'apply' }}
        id: verify
        run: |
          az login --service-principal \
            --username ${ARM_CLIENT_ID} \
            --password ${ARM_CLIENT_SECRET} \
            --tenant ${ARM_TENANT_ID} --output none 2>/dev/null || true

          az account set --subscription ${ARM_SUBSCRIPTION_ID} 2>/dev/null || true

          echo '{"vnets": [' > /tmp/azure_verification.json
          FIRST=true

          while IFS='|' read -r NAME VNET_ID CIDR; do
            [ -z "$NAME" ] && continue

            RG_NAME="rg-${NAME}"
            VNET_STATE=$(az network vnet show \
              --resource-group ${RG_NAME} \
              --name ${NAME} \
              --query 'provisioningState' \
              --output tsv 2>/dev/null || echo "error")

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo ',' >> /tmp/azure_verification.json
            fi

            echo "{\"name\": \"${NAME}\", \"id\": \"${VNET_ID}\", \"cidr\": \"${CIDR}\", \"state\": \"${VNET_STATE}\"}" >> /tmp/azure_verification.json
          done < <(echo '${{ steps.deploy.outputs.results }}' | jq -r '.[]?')

          echo ']}' >> /tmp/azure_verification.json
          VERIFICATION=$(cat /tmp/azure_verification.json | jq -c .)
          echo "verification=${VERIFICATION}" >> $GITHUB_OUTPUT

  gcp_vpcs:
    name: "GCP VPCs"
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.deploy_gcp == true }}
    environment: dev
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GCP_BLOCK_ID: ${{ secrets.GCP_BLOCK_ID }}
      IPAM_SPACE_ID: ${{ secrets.IPAM_SPACE_ID }}
    outputs:
      vpcs: ${{ steps.deploy.outputs.results }}
      verification: ${{ steps.verify.outputs.verification }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Restore Terraform state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            live/demos/vpc-gcp/.terraform
            live/demos/vpc-gcp/.terraform.lock.hcl
            live/demos/vpc-gcp/terraform-*.tfstate
            live/demos/vpc-gcp/terraform-*.tfstate.backup
          key: tfstate-vpc-gcp-${{ inputs.network_name }}
          restore-keys: |
            tfstate-vpc-gcp-

      - name: Deploy GCP VPCs
        id: deploy
        uses: ./.github/actions/deploy-network
        with:
          tf-dir: live/demos/vpc-gcp
          cloud: gcp
          emoji: "🟢"
          network-name: ${{ inputs.network_name }}
          count: ${{ inputs.vpc_count }}
          subnet-size: ${{ inputs.subnet_size }}
          name-var: vpc_name
          id-output: vpc_id
          cidr-output: vpc_cidr
          bloxone-host: ${{ env.BLOXONE_HOST }}
          bloxone-api-key: ${{ env.BLOXONE_API_KEY }}
          action: ${{ inputs.action }}
          extra-vars: |
            gcp_region=${{ inputs.gcp_region }}
            gcp_project_id=${{ env.GOOGLE_PROJECT }}
            gcp_block_id=${{ env.GCP_BLOCK_ID }}
            ipam_space_id=${{ env.IPAM_SPACE_ID }}

      - name: Save Terraform state cache
        if: ${{ inputs.action == 'apply' }}
        uses: actions/cache/save@v4
        with:
          path: |
            live/demos/vpc-gcp/.terraform
            live/demos/vpc-gcp/.terraform.lock.hcl
            live/demos/vpc-gcp/terraform-*.tfstate
            live/demos/vpc-gcp/terraform-*.tfstate.backup
          key: tfstate-vpc-gcp-${{ inputs.network_name }}

      - name: Verify GCP VPCs
        if: ${{ inputs.action == 'apply' }}
        id: verify
        run: |
          echo "${GOOGLE_CREDENTIALS}" | gcloud auth activate-service-account --key-file=- 2>/dev/null || true
          gcloud config set project ${GOOGLE_PROJECT} 2>/dev/null || true

          echo '{"vpcs": [' > /tmp/gcp_verification.json
          FIRST=true

          while IFS='|' read -r NAME VPC_ID CIDR; do
            [ -z "$NAME" ] && continue

            VPC_STATE=$(gcloud compute networks describe ${NAME} \
              --format="value(state)" 2>/dev/null || echo "error")

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo ',' >> /tmp/gcp_verification.json
            fi

            echo "{\"name\": \"${NAME}\", \"id\": \"${VPC_ID}\", \"cidr\": \"${CIDR}\", \"state\": \"${VPC_STATE}\"}" >> /tmp/gcp_verification.json
          done < <(echo '${{ steps.deploy.outputs.results }}' | jq -r '.[]?')

          echo ']}' >> /tmp/gcp_verification.json
          VERIFICATION=$(cat /tmp/gcp_verification.json | jq -c .)
          echo "verification=${VERIFICATION}" >> $GITHUB_OUTPUT

  summary:
    name: "Demo Summary"
    runs-on: ubuntu-latest
    needs: [preflight, aws_vpcs, azure_vnets, gcp_vpcs]
    if: always()
    env:
      AWS_VERIFICATION: ${{ needs.aws_vpcs.outputs.verification || '{}' }}
      AZURE_VERIFICATION: ${{ needs.azure_vnets.outputs.verification || '{}' }}
      GCP_VERIFICATION: ${{ needs.gcp_vpcs.outputs.verification || '{}' }}
    steps:
      - name: Generate Summary
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Generating VPC Deployment Summary                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ![UDDI](https://img.shields.io/badge/Infoblox-Universal_DDI-0066cc?style=for-the-badge)

          # 🚀 Infoblox Universal DDI — VPC Deployment Demo

          ## Automation Architecture

          ```mermaid
          graph LR
              A[🔷 UDDI IPAM<br/>Subnet Allocation] --> B[🟠 AWS VPCs<br/>VPC + Subnets]
              A --> C[🔵 Azure VNets<br/>VNet + Subnets]
              A --> D[🟢 GCP VPCs<br/>VPC + Subnets]
              B --> E[✅ Verified]
              C --> F[✅ Verified]
              D --> G[✅ Verified]
              style A fill:#0066cc,color:#fff
              style B fill:#FF9900,color:#fff
              style C fill:#0078D4,color:#fff
              style D fill:#4285F4,color:#fff
              style E fill:#00C853,color:#fff
              style F fill:#00C853,color:#fff
              style G fill:#00C853,color:#fff
          ```
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## ⚙️ Configuration

          | Parameter | Value |
          |-----------|-------|
          | **Action** | \`${{ inputs.action }}\` |
          | **Network Name** | \`${{ inputs.network_name }}\` |
          | **Subnet Size** | \`/${{ inputs.subnet_size }}\` |
          | **VPCs per Cloud** | \`${{ inputs.vpc_count }}\` |
          | **Total Networks** | ${{ needs.preflight.outputs.total_networks }} |
          | **Clouds** | ${{ needs.preflight.outputs.clouds }} |
          | **Executed** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          EOF

          if [ "${{ inputs.action }}" == "apply" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'SECTION'

          ## 📊 Deployed Resources

          SECTION

            # AWS VPCs
            if [ "${{ inputs.deploy_aws }}" == "true" ] && [ "${{ needs.aws_vpcs.result }}" == "success" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          ### 🟠 AWS VPCs (${{ inputs.aws_region }})

          | Name | VPC ID | CIDR (UDDI Allocated) | Status |
          |------|--------|----------------------|--------|
          EOF
              echo "${AWS_VERIFICATION}" | jq -r '.vpcs[]? | "| \(.name) | `\(.id)` | `\(.cidr)` | \(.state) |"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| - | - | - | No data |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Azure VNets
            if [ "${{ inputs.deploy_azure }}" == "true" ] && [ "${{ needs.azure_vnets.result }}" == "success" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          ### 🔵 Azure VNets (${{ inputs.azure_location }})

          | Name | VNet ID | CIDR (UDDI Allocated) | Status |
          |------|---------|----------------------|--------|
          EOF
              echo "${AZURE_VERIFICATION}" | jq -r '.vnets[]? | "| \(.name) | `\(.id)` | `\(.cidr)` | \(.state) |"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| - | - | - | No data |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # GCP VPCs
            if [ "${{ inputs.deploy_gcp }}" == "true" ] && [ "${{ needs.gcp_vpcs.result }}" == "success" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          ### 🟢 GCP VPCs (${{ inputs.gcp_region }})

          | Name | VPC ID | CIDR (UDDI Allocated) | Status |
          |------|--------|----------------------|--------|
          EOF
              echo "${GCP_VERIFICATION}" | jq -r '.vpcs[]? | "| \(.name) | `\(.id)` | `\(.cidr)` | \(.state) |"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| - | - | - | No data |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

          elif [ "${{ inputs.action }}" == "destroy" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'DESTROY'

          ## 🗑️ Resources Destroyed

          > Use Auto Cleanup workflow for resource deletion

          DESTROY
          fi

          cat >> $GITHUB_STEP_SUMMARY << 'FOOTER'

          ---

          ## 💡 Value Proposition

          - **Unified IPAM** — Single source of truth for IP allocation across AWS, Azure, and GCP
          - **Zero-Touch Automation** — UDDI allocates subnets → clouds provision VPCs/VNets automatically
          - **No Overlap, No Conflict** — Centralized IPAM prevents CIDR collisions across multi-cloud
          - **Full Auditability** — Terraform state + UDDI audit trail + cloud-native verification

          ---

          **Powered by [Infoblox Universal DDI](https://www.infoblox.com/products/universal-ddi/)** | Terraform UDDI Provider | GitHub Actions
          FOOTER
