name: "UDDI - Automated Cleanup"

on:
  schedule:
    # Runs at midnight GMT+2 (22:00 UTC) every day
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Safety gate — type "destroy" to confirm cleanup of all demo resources'
        required: true
        type: string

env:
  TF_IN_AUTOMATION: "true"

jobs:
  cleanup_dns:
    name: "Cleanup DNS records"
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: live/demos/dns
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm manual cleanup
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Cleanup cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Cleanup confirmed"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Restore Terraform state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            live/demos/dns/.terraform
            live/demos/dns/.terraform.lock.hcl
            live/demos/dns/terraform.tfstate
            live/demos/dns/terraform.tfstate.backup
          key: tfstate-${{ github.workflow }}
          restore-keys: |
            tfstate-

      - name: Find all demo records via API
        id: find_records
        uses: ./.github/actions/uddi
        with:
          operation: find-demo-records
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}
          zones: "virtualife.pro. az.gh.blox42.rocks. aws.gh.blox42.rocks. gcp.gh.blox42.rocks."

      - name: Delete demo records via API
        if: steps.find_records.outputs.has == 'true'
        id: delete_records
        uses: ./.github/actions/uddi
        with:
          operation: delete
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}
          resources: ${{ steps.find_records.outputs.result }}

      - name: Drop cached state after full cleanup
        if: steps.delete_records.outcome == 'success' && steps.find_records.outputs.has == 'true'
        run: rm -f terraform.tfstate terraform.tfstate.backup

      - name: Job Summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Generating DNS Cleanup Summary                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ![UDDI](https://img.shields.io/badge/Infoblox-Universal_DDI-0066cc?style=for-the-badge)

          # 🚀 Infoblox Universal DDI — DNS Cleanup

          ## Cleanup Architecture

          ```mermaid
          graph LR
              A[🔷 UDDI API<br/>Zone Scan] --> B[🔍 Find Tagged<br/>Records]
              B --> C[🟠 AWS Route53]
              B --> D[🔵 Azure DNS]
              B --> E[🟢 GCP Cloud DNS]
              B --> F[☁️ Cloudflare]
              C --> G[🗑️ Delete]
              D --> G
              E --> G
              F --> G
              style A fill:#0066cc,color:#fff
              style B fill:#6C757D,color:#fff
              style C fill:#FF9900,color:#fff
              style D fill:#0078D4,color:#fff
              style E fill:#4285F4,color:#fff
              style F fill:#F38020,color:#fff
              style G fill:#DC3545,color:#fff
          ```
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## ⚙️ Cleanup Details

          | Property | Value |
          |----------|-------|
          | **Trigger** | \`${{ github.event_name }}\` |
          | **Strategy** | Multi-zone tag-based cleanup (\`demo=true\`) |
          | **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | **Demo Records Found** | ${{ steps.find_records.outputs.count || '0' }} |
          | **Delete Duration** | ${{ steps.delete_records.outputs.duration || 'N/A' }}s |

          ### Zones Scanned

          | Zone | Provider |
          |------|----------|
          | \`virtualife.pro.\` | ☁️ Cloudflare |
          | \`az.gh.blox42.rocks.\` | 🔵 Azure DNS |
          | \`aws.gh.blox42.rocks.\` | 🟠 Route53 |
          | \`gcp.gh.blox42.rocks.\` | 🟢 Cloud DNS |

          EOF

          if [ "${{ steps.find_records.outputs.has }}" == "true" ]; then
            echo "> ✅ **Status**: All demo records destroyed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ℹ️ **Status**: No demo records found — nothing to cleanup" >> $GITHUB_STEP_SUMMARY
          fi

          cat >> $GITHUB_STEP_SUMMARY << 'FOOTER'

          ---

          ## 💡 Value Proposition

          - **Centralized DNS Management** — Single API to manage records across Cloudflare, Route53, Azure DNS, and Cloud DNS
          - **Tag-Based Lifecycle** — Demo resources are automatically discovered and cleaned up via UDDI tags
          - **Zero Orphans** — Scheduled cleanup ensures no demo resources persist beyond their lifecycle
          - **Full Auditability** — Every creation and deletion tracked through UDDI audit trail

          ---

          **Powered by [Infoblox Universal DDI](https://www.infoblox.com/products/universal-ddi/)** | Terraform UDDI Provider | GitHub Actions
          FOOTER

  cleanup_vpc:
    name: "Cleanup VPC/VNet resources"
    runs-on: ubuntu-latest
    environment: dev
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm manual cleanup
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Cleanup cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Cleanup confirmed"

      - name: Find demo subnets in UDDI IPAM
        id: find_subnets
        uses: ./.github/actions/uddi
        with:
          operation: find-demo-subnets
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}

      - name: Find demo AWS VPCs
        id: find_aws
        uses: ./.github/actions/cloud-cleanup
        with:
          operation: find
          cloud: aws
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Delete demo AWS VPCs
        if: steps.find_aws.outputs.has == 'true'
        id: delete_aws
        continue-on-error: true
        uses: ./.github/actions/cloud-cleanup
        with:
          operation: delete
          cloud: aws
          resources: ${{ steps.find_aws.outputs.result }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Find demo Azure VNets
        id: find_azure
        uses: ./.github/actions/cloud-cleanup
        with:
          operation: find
          cloud: azure
          arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
          arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}
          arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}

      - name: Delete demo Azure VNets
        if: steps.find_azure.outputs.has == 'true'
        id: delete_azure
        continue-on-error: true
        uses: ./.github/actions/cloud-cleanup
        with:
          operation: delete
          cloud: azure
          resources: ${{ steps.find_azure.outputs.result }}
          arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
          arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}
          arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}

      - name: Find demo GCP VPCs
        id: find_gcp
        uses: ./.github/actions/cloud-cleanup
        with:
          operation: find
          cloud: gcp
          gcp-credentials: ${{ secrets.GCP_CREDENTIALS }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Delete demo GCP VPCs
        if: steps.find_gcp.outputs.has == 'true'
        id: delete_gcp
        continue-on-error: true
        uses: ./.github/actions/cloud-cleanup
        with:
          operation: delete
          cloud: gcp
          resources: ${{ steps.find_gcp.outputs.result }}
          gcp-credentials: ${{ secrets.GCP_CREDENTIALS }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Delete demo subnets from UDDI
        if: steps.find_subnets.outputs.has == 'true'
        id: delete_subnets
        uses: ./.github/actions/uddi
        with:
          operation: delete
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}
          resources: ${{ steps.find_subnets.outputs.result }}

      - name: VPC Cleanup Summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Generating VPC Cleanup Summary                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ![UDDI](https://img.shields.io/badge/Infoblox-Universal_DDI-0066cc?style=for-the-badge)

          # 🚀 Infoblox Universal DDI — VPC Cleanup

          ## Cleanup Architecture

          ```mermaid
          graph LR
              A[🔷 UDDI IPAM<br/>Subnet Scan] --> B[🟠 AWS VPCs<br/>Delete]
              A --> C[🔵 Azure VNets<br/>Delete]
              A --> D[🟢 GCP VPCs<br/>Delete]
              B --> E[🗑️ UDDI Subnets<br/>Release]
              C --> E
              D --> E
              style A fill:#0066cc,color:#fff
              style B fill:#FF9900,color:#fff
              style C fill:#0078D4,color:#fff
              style D fill:#4285F4,color:#fff
              style E fill:#DC3545,color:#fff
          ```
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## ⚙️ Cleanup Details

          | Property | Value |
          |----------|-------|
          | **Trigger** | \`${{ github.event_name }}\` |
          | **Strategy** | Tag-based cleanup (\`demo=true\` + cloud provider tags) |
          | **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | **Demo Subnets Found** | ${{ steps.find_subnets.outputs.count || '0' }} |
          | **Delete Duration** | ${{ steps.delete_subnets.outputs.duration || 'N/A' }}s |

          ### Clouds Scanned

          | Cloud | Filter | Found | Torn down | Failed |
          |-------|--------|-------|-----------|--------|
          | 🟠 AWS | `Demo=true` + `ManagedBy=terraform` | ${{ steps.find_aws.outputs.count || '0' }} | ${{ steps.delete_aws.outputs.deleted || '0' }} | ${{ steps.delete_aws.outputs.failed || '0' }} |
          | 🔵 Azure | `demo=true` | ${{ steps.find_azure.outputs.count || '0' }} | ${{ steps.delete_azure.outputs.deleted || '0' }} | ${{ steps.delete_azure.outputs.failed || '0' }} |
          | 🟢 GCP | `description:UDDI` | ${{ steps.find_gcp.outputs.count || '0' }} | ${{ steps.delete_gcp.outputs.deleted || '0' }} | ${{ steps.delete_gcp.outputs.failed || '0' }} |

          EOF

          FAILED=$(( ${{ steps.delete_aws.outputs.failed || '0' }} + ${{ steps.delete_azure.outputs.failed || '0' }} + ${{ steps.delete_gcp.outputs.failed || '0' }} ))
          FOUND=$(( ${{ steps.find_aws.outputs.count || '0' }} + ${{ steps.find_azure.outputs.count || '0' }} + ${{ steps.find_gcp.outputs.count || '0' }} + ${{ steps.find_subnets.outputs.count || '0' }} ))
          if [ "$FAILED" -gt 0 ]; then
            echo "> ⚠️ **Status**: ${FAILED} resource(s) failed to tear down — see job logs" >> $GITHUB_STEP_SUMMARY
          elif [ "$FOUND" -eq 0 ]; then
            echo "> ℹ️ **Status**: No demo resources found — nothing to cleanup" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ **Status**: All demo VPC/VNet resources destroyed" >> $GITHUB_STEP_SUMMARY
          fi

          cat >> $GITHUB_STEP_SUMMARY << 'FOOTER'

          ---

          ## 💡 Value Proposition

          - **Unified IPAM Lifecycle** — UDDI manages allocation and deallocation across all clouds
          - **Tag-Based Discovery** — Demo resources automatically found via consistent tagging strategy
          - **Multi-Cloud Cleanup** — AWS, Azure, and GCP resources cleaned in parallel
          - **Full Auditability** — Every allocation and release tracked through UDDI audit trail

          ---

          **Powered by [Infoblox Universal DDI](https://www.infoblox.com/products/universal-ddi/)** | Terraform UDDI Provider | GitHub Actions
          FOOTER
