name: "UDDI - Automated Cleanup"

on:
  schedule:
    # Runs at midnight GMT+2 (22:00 UTC) every day
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Safety gate — type "destroy" to confirm cleanup of all demo resources'
        required: true
        type: string

env:
  TF_IN_AUTOMATION: "true"

jobs:
  cleanup_dns:
    name: "Cleanup DNS records"
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: live/demos/dns
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm manual cleanup
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Cleanup cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Cleanup confirmed"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Restore Terraform state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            live/demos/dns/.terraform
            live/demos/dns/.terraform.lock.hcl
            live/demos/dns/terraform.tfstate
            live/demos/dns/terraform.tfstate.backup
          key: tfstate-${{ github.workflow }}
          restore-keys: |
            tfstate-

      - name: Find all demo records via API
        id: find_records
        uses: ./.github/actions/uddi
        with:
          operation: find-demo-records
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}
          zones: "virtualife.pro. az.gh.blox42.rocks. aws.gh.blox42.rocks. gcp.gh.blox42.rocks."

      - name: Delete demo records via API
        if: steps.find_records.outputs.has == 'true'
        id: delete_records
        uses: ./.github/actions/uddi
        with:
          operation: delete
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}
          resources: ${{ steps.find_records.outputs.result }}

      - name: Drop cached state after full cleanup
        if: steps.delete_records.outcome == 'success' && steps.find_records.outputs.has == 'true'
        run: rm -f terraform.tfstate terraform.tfstate.backup

      - name: Job Summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Generating DNS Cleanup Summary                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ![UDDI](https://img.shields.io/badge/Infoblox-Universal_DDI-0066cc?style=for-the-badge)

          # 🚀 Infoblox Universal DDI — DNS Cleanup

          ## Cleanup Architecture

          ```mermaid
          graph LR
              A[🔷 UDDI API<br/>Zone Scan] --> B[🔍 Find Tagged<br/>Records]
              B --> C[🟠 AWS Route53]
              B --> D[🔵 Azure DNS]
              B --> E[🟢 GCP Cloud DNS]
              B --> F[☁️ Cloudflare]
              C --> G[🗑️ Delete]
              D --> G
              E --> G
              F --> G
              style A fill:#0066cc,color:#fff
              style B fill:#6C757D,color:#fff
              style C fill:#FF9900,color:#fff
              style D fill:#0078D4,color:#fff
              style E fill:#4285F4,color:#fff
              style F fill:#F38020,color:#fff
              style G fill:#DC3545,color:#fff
          ```
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## ⚙️ Cleanup Details

          | Property | Value |
          |----------|-------|
          | **Trigger** | \`${{ github.event_name }}\` |
          | **Strategy** | Multi-zone tag-based cleanup (\`demo=true\`) |
          | **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | **Demo Records Found** | ${{ steps.find_records.outputs.count || '0' }} |
          | **Delete Duration** | ${{ steps.delete_records.outputs.duration || 'N/A' }}s |

          ### Zones Scanned

          | Zone | Provider |
          |------|----------|
          | \`virtualife.pro.\` | ☁️ Cloudflare |
          | \`az.gh.blox42.rocks.\` | 🔵 Azure DNS |
          | \`aws.gh.blox42.rocks.\` | 🟠 Route53 |
          | \`gcp.gh.blox42.rocks.\` | 🟢 Cloud DNS |

          EOF

          if [ "${{ steps.find_records.outputs.has }}" == "true" ]; then
            echo "> ✅ **Status**: All demo records destroyed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ℹ️ **Status**: No demo records found — nothing to cleanup" >> $GITHUB_STEP_SUMMARY
          fi

          cat >> $GITHUB_STEP_SUMMARY << 'FOOTER'

          ---

          ## 💡 Value Proposition

          - **Centralized DNS Management** — Single API to manage records across Cloudflare, Route53, Azure DNS, and Cloud DNS
          - **Tag-Based Lifecycle** — Demo resources are automatically discovered and cleaned up via UDDI tags
          - **Zero Orphans** — Scheduled cleanup ensures no demo resources persist beyond their lifecycle
          - **Full Auditability** — Every creation and deletion tracked through UDDI audit trail

          ---

          **Powered by [Infoblox Universal DDI](https://www.infoblox.com/products/universal-ddi/)** | Terraform UDDI Provider | GitHub Actions
          FOOTER

  cleanup_vpc:
    name: "Cleanup VPC/VNet resources"
    runs-on: ubuntu-latest
    environment: dev
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm manual cleanup
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Cleanup cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Cleanup confirmed"

      - name: Find demo subnets in UDDI IPAM
        id: find_subnets
        uses: ./.github/actions/uddi
        with:
          operation: find-demo-subnets
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}

      - name: Cleanup AWS VPCs via AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set +e
          
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🧹 Phase 2: Cleaning Up AWS VPCs                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔍 Finding AWS VPCs with Demo=true tag..."
          
          # Get all regions to search (search common regions)
          REGIONS="eu-central-1 us-east-1 us-west-2 ap-southeast-1"
          
          for REGION in ${REGIONS}; do
            echo "Checking region: ${REGION}"
            
            # Find VPCs with ManagedBy=terraform tag (more reliable than Demo tag)
            VPC_IDS=$(aws ec2 describe-vpcs \
              --region ${REGION} \
              --filters "Name=tag:ManagedBy,Values=terraform" "Name=tag:Demo,Values=true" \
              --query 'Vpcs[].VpcId' \
              --output text 2>/dev/null)
            
            if [ -z "${VPC_IDS}" ]; then
              continue
            fi
            
            for VPC_ID in ${VPC_IDS}; do
              echo "🗑️ Deleting VPC: ${VPC_ID} in ${REGION}"
              
              # Get VPC name for logging
              VPC_NAME=$(aws ec2 describe-vpcs \
                --region ${REGION} \
                --vpc-ids ${VPC_ID} \
                --query 'Vpcs[0].Tags[?Key==`Name`].Value' \
                --output text 2>/dev/null)
              
              echo "  Name: ${VPC_NAME}"
              
              # Delete Internet Gateways
              IGW_IDS=$(aws ec2 describe-internet-gateways \
                --region ${REGION} \
                --filters "Name=attachment.vpc-id,Values=${VPC_ID}" \
                --query 'InternetGateways[].InternetGatewayId' \
                --output text 2>/dev/null)
              
              for IGW_ID in ${IGW_IDS}; do
                echo "  Detaching and deleting IGW: ${IGW_ID}"
                aws ec2 detach-internet-gateway \
                  --region ${REGION} \
                  --internet-gateway-id ${IGW_ID} \
                  --vpc-id ${VPC_ID} 2>/dev/null || true
                aws ec2 delete-internet-gateway \
                  --region ${REGION} \
                  --internet-gateway-id ${IGW_ID} 2>/dev/null || true
              done
              
              # Delete VPC
              echo "  Deleting VPC: ${VPC_ID}"
              aws ec2 delete-vpc \
                --region ${REGION} \
                --vpc-id ${VPC_ID} 2>/dev/null && echo "  ✅ VPC deleted" || echo "  ⚠️ VPC deletion failed"
              
              echo ""
            done
          done

      - name: Cleanup Azure VNets via Azure CLI
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          set +e
          
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🧹 Phase 3: Cleaning Up Azure VNets                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔍 Finding Azure Resource Groups with demo=true tag..."
          
          # Login to Azure
          az login --service-principal \
            --username ${ARM_CLIENT_ID} \
            --password ${ARM_CLIENT_SECRET} \
            --tenant ${ARM_TENANT_ID} --output none 2>/dev/null || true
          
          az account set --subscription ${ARM_SUBSCRIPTION_ID} 2>/dev/null || true
          
          # Find resource groups with demo=true tag
          RG_NAMES=$(az group list \
            --tag demo=true \
            --query '[].name' \
            --output tsv 2>/dev/null)
          
          if [ -z "${RG_NAMES}" ]; then
            echo "No Azure Resource Groups with demo=true found"
          else
            for RG_NAME in ${RG_NAMES}; do
              echo "🗑️ Deleting Resource Group: ${RG_NAME}"
              az group delete \
                --name ${RG_NAME} \
                --yes \
                --no-wait 2>/dev/null && echo "  ✅ Deletion initiated" || echo "  ⚠️ Deletion failed"
            done
          fi

      - name: Cleanup GCP VPCs via gcloud CLI
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set +e
          
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🧹 Phase 4: Cleaning Up GCP VPCs                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔍 Finding GCP VPCs with description containing 'UDDI'..."
          
          # Authenticate with GCP
          echo "${GOOGLE_CREDENTIALS}" | gcloud auth activate-service-account --key-file=- 2>/dev/null || true
          gcloud config set project ${GCP_PROJECT_ID} 2>/dev/null || true
          
          # List all VPC networks and filter by description
          VPC_NAMES=$(gcloud compute networks list \
            --filter="description:UDDI" \
            --format="value(name)" 2>/dev/null)
          
          if [ -z "${VPC_NAMES}" ]; then
            echo "No GCP VPCs with UDDI description found"
          else
            for VPC_NAME in ${VPC_NAMES}; do
              echo "🗑️ Deleting VPC: ${VPC_NAME}"
              
              # Delete all subnets first
              SUBNETS=$(gcloud compute networks subnets list \
                --network=${VPC_NAME} \
                --format="value(name,region)" 2>/dev/null)
              
              while read -r SUBNET_INFO; do
                SUBNET_NAME=$(echo ${SUBNET_INFO} | awk '{print $1}')
                SUBNET_REGION=$(echo ${SUBNET_INFO} | awk '{print $2}')
                if [ -n "${SUBNET_NAME}" ]; then
                  echo "  Deleting subnet: ${SUBNET_NAME}"
                  gcloud compute networks subnets delete ${SUBNET_NAME} \
                    --region=${SUBNET_REGION} \
                    --quiet 2>/dev/null || true
                fi
              done <<< "${SUBNETS}"
              
              # Delete VPC
              echo "  Deleting VPC network: ${VPC_NAME}"
              gcloud compute networks delete ${VPC_NAME} \
                --quiet 2>/dev/null && echo "  ✅ VPC deleted" || echo "  ⚠️ VPC deletion failed"
              
              echo ""
            done
          fi

      - name: Delete demo subnets from UDDI
        if: steps.find_subnets.outputs.has == 'true'
        id: delete_subnets
        uses: ./.github/actions/uddi
        with:
          operation: delete
          host: ${{ env.BLOXONE_HOST }}
          api-key: ${{ env.BLOXONE_API_KEY }}
          resources: ${{ steps.find_subnets.outputs.result }}

      - name: VPC Cleanup Summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Generating VPC Cleanup Summary                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ![UDDI](https://img.shields.io/badge/Infoblox-Universal_DDI-0066cc?style=for-the-badge)

          # 🚀 Infoblox Universal DDI — VPC Cleanup

          ## Cleanup Architecture

          ```mermaid
          graph LR
              A[🔷 UDDI IPAM<br/>Subnet Scan] --> B[🟠 AWS VPCs<br/>Delete]
              A --> C[🔵 Azure VNets<br/>Delete]
              A --> D[🟢 GCP VPCs<br/>Delete]
              B --> E[🗑️ UDDI Subnets<br/>Release]
              C --> E
              D --> E
              style A fill:#0066cc,color:#fff
              style B fill:#FF9900,color:#fff
              style C fill:#0078D4,color:#fff
              style D fill:#4285F4,color:#fff
              style E fill:#DC3545,color:#fff
          ```
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## ⚙️ Cleanup Details

          | Property | Value |
          |----------|-------|
          | **Trigger** | \`${{ github.event_name }}\` |
          | **Strategy** | Tag-based cleanup (\`demo=true\` + cloud provider tags) |
          | **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | **Demo Subnets Found** | ${{ steps.find_subnets.outputs.count || '0' }} |
          | **Delete Duration** | ${{ steps.delete_subnets.outputs.duration || 'N/A' }}s |

          ### Clouds Scanned

          | Cloud | Method |
          |-------|--------|
          | 🟠 AWS | VPC tag filter (\`Demo=true\`, \`ManagedBy=terraform\`) |
          | 🔵 Azure | Resource Group tag filter (\`demo=true\`) |
          | 🟢 GCP | VPC description filter (\`UDDI\`) |

          EOF

          if [ "${{ steps.find_subnets.outputs.has }}" == "true" ]; then
            echo "> ✅ **Status**: All demo VPC/VNet resources destroyed" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ℹ️ **Status**: No demo VPC/VNet resources found — nothing to cleanup" >> $GITHUB_STEP_SUMMARY
          fi

          cat >> $GITHUB_STEP_SUMMARY << 'FOOTER'

          ---

          ## 💡 Value Proposition

          - **Unified IPAM Lifecycle** — UDDI manages allocation and deallocation across all clouds
          - **Tag-Based Discovery** — Demo resources automatically found via consistent tagging strategy
          - **Multi-Cloud Cleanup** — AWS, Azure, and GCP resources cleaned in parallel
          - **Full Auditability** — Every allocation and release tracked through UDDI audit trail

          ---

          **Powered by [Infoblox Universal DDI](https://www.infoblox.com/products/universal-ddi/)** | Terraform UDDI Provider | GitHub Actions
          FOOTER
