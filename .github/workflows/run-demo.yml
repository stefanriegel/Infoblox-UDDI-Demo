name: "UDDI - Multi-Cloud DNS"

on:
  workflow_dispatch:
    inputs:
      dns_provider:
        description: "DNS provider for record verification and management"
        required: true
        type: choice
        options: ["Cloudflare (virtualife.pro)", "Azure DNS (az.gh.blox42.rocks)", "Route53 (aws.gh.blox42.rocks)", "Cloud DNS (gcp.gh.blox42.rocks)"]
        default: "Cloudflare (virtualife.pro)"
      record_name:
        description: "DNS hostname (without zone suffix, e.g., 'my-app' becomes my-app.virtualife.pro)"
        required: true
        type: string
      record_type:
        description: "DNS record type"
        required: true
        type: choice
        options: [A, AAAA, TXT, CNAME]
        default: A
      record_value:
        description: "Record value: IP address for A (e.g., 10.0.1.1), IPv6 for AAAA, target FQDN with trailing dot for CNAME (e.g., example.com.), or text content for TXT"
        default: "203.0.113.10"
        required: true
        type: string
      ttl:
        description: "TTL in seconds (how long resolvers cache this record)"
        default: 120
        required: true
        type: number
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options: [apply, destroy]
        default: apply

env:
  TF_IN_AUTOMATION: "true"

jobs:
  demo:
    name: "Deploy DNS via Infoblox UDDI → ${{ inputs.dns_provider }}"
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: live/demos/dns
    env:
      BLOXONE_HOST: ${{ vars.BLOXONE_HOST }}
      BLOXONE_API_KEY: ${{ secrets.BLOXONE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Cache Terraform state and plugins (local backend)
        uses: actions/cache@v4
        with:
          path: |
            live/demos/dns/.terraform
            live/demos/dns/.terraform.lock.hcl
            live/demos/dns/terraform.tfstate
            live/demos/dns/terraform.tfstate.backup
          key: tfstate-${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.dns_provider }}-${{ inputs.record_name }}-${{ inputs.record_type }}

      - name: Set Zone FQDN based on provider
        id: set_zone
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Phase 1: Configuration & Zone Setup                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          # Extract provider name and zone from input
          case "${{ inputs.dns_provider }}" in
            "Cloudflare"*)
              echo "zone_fqdn=virtualife.pro." >> $GITHUB_OUTPUT
              echo "provider_name=Cloudflare" >> $GITHUB_OUTPUT
              ;;
            "Azure DNS"*)
              echo "zone_fqdn=az.gh.blox42.rocks." >> $GITHUB_OUTPUT
              echo "provider_name=Azure DNS" >> $GITHUB_OUTPUT
              ;;
            "Route53"*)
              echo "zone_fqdn=aws.gh.blox42.rocks." >> $GITHUB_OUTPUT
              echo "provider_name=Route53" >> $GITHUB_OUTPUT
              ;;
            "Cloud DNS"*)
              echo "zone_fqdn=gcp.gh.blox42.rocks." >> $GITHUB_OUTPUT
              echo "provider_name=Cloud DNS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Terraform Init
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Phase 2: Terraform Init                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          terraform init -input=false -no-color

      - name: Terraform Validate
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Phase 2b: Terraform Validate                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Phase 3: Terraform Plan                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          terraform plan -input=false -no-color \
            -var="bloxone_host=${BLOXONE_HOST:-https://csp.infoblox.com}" \
            -var="bloxone_api_key=${BLOXONE_API_KEY}" \
            -var="zone_fqdn=${{ steps.set_zone.outputs.zone_fqdn }}" \
            -var="record_name=${{ inputs.record_name }}" \
            -var="record_type=${{ inputs.record_type }}" \
            -var="record_value=${{ inputs.record_value }}" \
            -var="ttl=${{ inputs.ttl }}" \
            -out=tfplan

      - name: Terraform Apply
        id: apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Phase 4: Terraform Apply                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          APPLY_START=$(date +%s)
          terraform apply -input=false -auto-approve -no-color tfplan
          terraform output -json > tfoutputs.json
          APPLY_END=$(date +%s)
          APPLY_DURATION=$((APPLY_END - APPLY_START))
          echo "✅ DNS deployment completed in ${APPLY_DURATION}s"
          echo "apply_duration=${APPLY_DURATION}" >> $GITHUB_OUTPUT

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔷 Phase 4: Terraform Destroy                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          terraform destroy -input=false -auto-approve -no-color \
            -var="bloxone_host=${BLOXONE_HOST:-https://csp.infoblox.com}" \
            -var="bloxone_api_key=${BLOXONE_API_KEY}" \
            -var="zone_fqdn=${{ steps.set_zone.outputs.zone_fqdn }}" \
            -var="record_name=${{ inputs.record_name }}" \
            -var="record_type=${{ inputs.record_type }}" \
            -var="record_value=${{ inputs.record_value }}" \
            -var="ttl=${{ inputs.ttl }}"

      - name: Wait for UDDI sync
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "⏳ Waiting 10 seconds for UDDI → downstream sync..."
          sleep 10

      - name: Resolve across public DNS
        if: ${{ inputs.action == 'apply' }}
        id: resolvers
        uses: ./.github/actions/dns-resolvers
        with:
          fqdn: "${{ inputs.record_name }}.${{ steps.set_zone.outputs.zone_fqdn }}"
          type: ${{ inputs.record_type }}
          output-dir: live/demos/dns

      - name: DNS Verification & Provider Status
        if: ${{ inputs.action == 'apply' }}
        uses: ./.github/actions/dns-provider-record
        with:
          dns-provider: ${{ inputs.dns_provider }}
          zone-fqdn: ${{ steps.set_zone.outputs.zone_fqdn }}
          record-name: ${{ inputs.record_name }}
          record-type: ${{ inputs.record_type }}
          output-dir: live/demos/dns
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          cf-zone-id: ${{ secrets.CF_ZONE_ID }}
          arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
          arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}
          arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
          azure-dns-resource-group: ${{ secrets.AZURE_DNS_RESOURCE_GROUP }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          route53-hosted-zone-id: ${{ secrets.ROUTE53_HOSTED_ZONE_ID }}
          gcp-credentials: ${{ secrets.GCP_CREDENTIALS }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Upload artifacts (proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-proof
          path: |
            live/demos/dns/tfoutputs.json
            live/demos/dns/dig-google.txt
            live/demos/dns/dig-cloudflare.txt
            live/demos/dns/dig-quad9.txt
            live/demos/dns/dig-full.txt
            live/demos/dns/cf-response.json
            live/demos/dns/azure-response.json
            live/demos/dns/route53-response.json
            live/demos/dns/gcp-response.json
            live/demos/dns/dns-record.json
            live/demos/dns/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 7

      - name: Job Summary - Header
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ![UDDI](https://img.shields.io/badge/Infoblox-Universal_DDI-0066cc?style=for-the-badge)

          # 🚀 Infoblox Universal DDI — DNS Demo

          ## Executive Summary

          This demonstration showcases **Infoblox Universal DDI** as a **single source of truth** for DNS management across multiple cloud providers. DNS records created in UDDI are automatically synchronized to downstream DNS services.

          HEADER
          
          # Status badges
          if [ "${{ inputs.action }}" == "apply" ]; then
            echo "![Status](https://img.shields.io/badge/Status-Deployed-success?style=for-the-badge)" >> $GITHUB_STEP_SUMMARY
            echo "![Automation](https://img.shields.io/badge/Automation-Active-00C853?style=for-the-badge)" >> $GITHUB_STEP_SUMMARY
            # Dynamic target badge based on provider
            case "${{ inputs.dns_provider }}" in
              "Cloudflare"*)
                echo "![Target](https://img.shields.io/badge/Target-Cloudflare-f38020?style=for-the-badge&logo=cloudflare)" >> $GITHUB_STEP_SUMMARY
                ;;
              "Azure DNS"*)
                echo "![Target](https://img.shields.io/badge/Target-Azure_DNS-0078D4?style=for-the-badge&logo=microsoftazure)" >> $GITHUB_STEP_SUMMARY
                ;;
              "Route53"*)
                echo "![Target](https://img.shields.io/badge/Target-Route53-FF9900?style=for-the-badge&logo=amazonaws)" >> $GITHUB_STEP_SUMMARY
                ;;
              "Cloud DNS"*)
                echo "![Target](https://img.shields.io/badge/Target-Cloud_DNS-4285F4?style=for-the-badge&logo=googlecloud)" >> $GITHUB_STEP_SUMMARY
                ;;
            esac
          else
            echo "![Status](https://img.shields.io/badge/Status-Destroyed-critical?style=for-the-badge)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Workflow diagram - dynamic based on provider
          echo "## 🔄 Automation Architecture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`mermaid" >> $GITHUB_STEP_SUMMARY
          echo "graph TB" >> $GITHUB_STEP_SUMMARY
          echo "    A[Infrastructure as Code<br/>Terraform] -->|UDDI Provider| B[Infoblox UDDI<br/>Single Source of Truth]" >> $GITHUB_STEP_SUMMARY
          
          case "${{ inputs.dns_provider }}" in
            "Cloudflare"*)
              echo "    B -->|Native Integration| C1[Cloudflare]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C2[AWS Route53]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C3[Azure DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C4[GCP Cloud DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    C1 --> D[Global DNS Resolution]" >> $GITHUB_STEP_SUMMARY
              echo "    C2 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    C3 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    C4 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    style C1 fill:#f38020,color:#fff" >> $GITHUB_STEP_SUMMARY
              ;;
            "Azure DNS"*)
              echo "    B -.->|Also supports| C1[Cloudflare]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C2[AWS Route53]" >> $GITHUB_STEP_SUMMARY
              echo "    B -->|Native Integration| C3[Azure DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C4[GCP Cloud DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    C1 -.-> D[Global DNS Resolution]" >> $GITHUB_STEP_SUMMARY
              echo "    C2 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    C3 --> D" >> $GITHUB_STEP_SUMMARY
              echo "    C4 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    style C3 fill:#0078D4,color:#fff" >> $GITHUB_STEP_SUMMARY
              ;;
            "Route53"*)
              echo "    B -.->|Also supports| C1[Cloudflare]" >> $GITHUB_STEP_SUMMARY
              echo "    B -->|Native Integration| C2[AWS Route53]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C3[Azure DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C4[GCP Cloud DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    C1 -.-> D[Global DNS Resolution]" >> $GITHUB_STEP_SUMMARY
              echo "    C2 --> D" >> $GITHUB_STEP_SUMMARY
              echo "    C3 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    C4 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    style C2 fill:#FF9900,color:#fff" >> $GITHUB_STEP_SUMMARY
              ;;
            "Cloud DNS"*)
              echo "    B -.->|Also supports| C1[Cloudflare]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C2[AWS Route53]" >> $GITHUB_STEP_SUMMARY
              echo "    B -.->|Also supports| C3[Azure DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    B -->|Native Integration| C4[GCP Cloud DNS]" >> $GITHUB_STEP_SUMMARY
              echo "    C1 -.-> D[Global DNS Resolution]" >> $GITHUB_STEP_SUMMARY
              echo "    C2 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    C3 -.-> D" >> $GITHUB_STEP_SUMMARY
              echo "    C4 --> D" >> $GITHUB_STEP_SUMMARY
              echo "    style C4 fill:#4285F4,color:#fff" >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          
          echo "    style B fill:#0066cc,color:#fff,stroke:#003d7a,stroke-width:3px" >> $GITHUB_STEP_SUMMARY
          echo "    style A fill:#2088FF,color:#fff" >> $GITHUB_STEP_SUMMARY
          echo "    style D fill:#00C853,color:#fff" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Infoblox UDDI** acts as the central management plane, distributing DNS records to multiple cloud providers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Configuration Section
          echo "## ⚙️ Record Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.action }}" == "apply" ]; then
            echo "| **Action** | 🚀 \`Deploy\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Action** | 🗑️ \`Destroy\` |" >> $GITHUB_STEP_SUMMARY
          fi
          # Display provider and zone (avoid GitHub secret masking by using literal strings)
          case "${{ inputs.dns_provider }}" in
            "Cloudflare"*)
              echo "| **DNS Provider** | \`Cloudflare\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Zone** | \`virtualife.pro\` |" >> $GITHUB_STEP_SUMMARY
              ;;
            "Azure DNS"*)
              echo "| **DNS Provider** | \`Azure DNS\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Zone** | \`az.gh.blox42.rocks\` |" >> $GITHUB_STEP_SUMMARY
              ;;
            "Route53"*)
              echo "| **DNS Provider** | \`Route53\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Zone** | \`aws.gh.blox42.rocks\` |" >> $GITHUB_STEP_SUMMARY
              ;;
            "Cloud DNS"*)
              echo "| **DNS Provider** | \`Cloud DNS\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Zone** | \`gcp.gh.blox42.rocks\` |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          
          echo "| **Record Name** | \`${{ inputs.record_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Type** | \`${{ inputs.record_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Value** | \`${{ inputs.record_value }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **TTL** | \`${{ inputs.ttl }}s\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Executed** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.apply.outputs.apply_duration }}" ]; then
            echo "| **Apply Duration** | \`${{ steps.apply.outputs.apply_duration }}s\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - DNS Verification
        if: ${{ inputs.action == 'apply' }}
        run: |
          # DNS Verification Section
          if [ "${{ inputs.action }}" == "apply" ]; then
            echo "## 🌐 Global DNS Verification" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*Verified across multiple authoritative DNS resolvers worldwide*" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ -f "dig-google.txt" ]; then
              echo "### Google DNS (8.8.8.8)" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat dig-google.txt >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ -f "dig-cloudflare.txt" ]; then
              echo "### Cloudflare DNS (1.1.1.1)" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat dig-cloudflare.txt >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ -f "dig-quad9.txt" ]; then
              echo "### Quad9 DNS (9.9.9.9)" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat dig-quad9.txt >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Provider-specific dashboard — rendered from the normalized record written
            # once in the DNS Verification step (no second-pass re-extraction).
            REC_PROVIDER=""
            REC_FOUND="false"
            if [ -f "dns-record.json" ]; then
              REC_PROVIDER=$(jq -r '.provider // empty' dns-record.json 2>/dev/null)
              REC_FOUND=$(jq -r '.found // false' dns-record.json 2>/dev/null)
            fi

            if [[ "${{ inputs.dns_provider }}" == "Cloudflare"* ]] && [ "${REC_PROVIDER}" == "cloudflare" ]; then
              echo "## Downstream DNS Service: Cloudflare" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              if [ "${REC_FOUND}" == "true" ]; then
                CF_NAME=$(jq -r '.fqdn' dns-record.json)
                CF_TYPE=$(jq -r '.type' dns-record.json)
                CF_CONTENT=$(jq -r '.target' dns-record.json)
                CF_TTL=$(jq -r '.ttl' dns-record.json)
                CF_PROXIED=$(jq -r '.proxied' dns-record.json)
                CF_ID=$(jq -r '.id' dns-record.json)

                echo "> ✅ **Synchronization Complete** - Record successfully deployed to Cloudflare's global edge network" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                
                echo "### Record Details" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
                echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
                echo "| **Cloudflare Record ID** | \`${CF_ID}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **FQDN** | \`${CF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Record Type** | \`${CF_TYPE}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Target** | \`${CF_CONTENT}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **TTL** | \`${CF_TTL}s\` |" >> $GITHUB_STEP_SUMMARY
                
                if [ "${CF_PROXIED}" == "true" ]; then
                  echo "| **Proxy Status** | 🟠 **PROXIED** (Traffic routed through Cloudflare) |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**⚡ Benefits Active:**" >> $GITHUB_STEP_SUMMARY
                  echo "- DDoS Protection" >> $GITHUB_STEP_SUMMARY
                  echo "- CDN Acceleration" >> $GITHUB_STEP_SUMMARY
                  echo "- SSL/TLS Encryption" >> $GITHUB_STEP_SUMMARY
                  echo "- WAF (Web Application Firewall)" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| **Proxy Status** | ⚪ DNS Only (Direct connection) |" >> $GITHUB_STEP_SUMMARY
                fi
                
                echo "" >> $GITHUB_STEP_SUMMARY
                CONSOLE_URL=$(jq -r '.console_url // empty' dns-record.json)
                if [ -n "${CONSOLE_URL}" ]; then
                  echo "### 🔗 Management Links" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "[📡 View in Cloudflare Dashboard](${CONSOLE_URL})" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "> ⏳ Record synchronization in progress (typically completes within seconds)" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Azure DNS Dashboard Info
            if [[ "${{ inputs.dns_provider }}" == "Azure DNS"* ]] && [ "${REC_PROVIDER}" == "azure" ]; then
              echo "## Downstream DNS Service: Azure DNS" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              if [ "${REC_FOUND}" == "true" ]; then
                RECORD_ID=$(jq -r '.id' dns-record.json)
                # Construct FQDN manually to avoid GitHub secret masking
                AZURE_FQDN="${{ inputs.record_name }}.az.gh.blox42.rocks."
                AZURE_TTL=$(jq -r '.ttl' dns-record.json)
                AZURE_PROVISIONING_STATE=$(jq -r '.provisioning_state' dns-record.json)
                AZURE_RECORDS=$(jq -r '.target' dns-record.json)

                echo "> ✅ **Synchronization Complete** - Record successfully deployed to Azure DNS" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                
                echo "### Record Details" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
                echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
                echo "| **Azure Resource ID** | \`${RECORD_ID}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **FQDN** | \`${AZURE_FQDN}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Record Type** | \`${{ inputs.record_type }}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Target** | \`${AZURE_RECORDS}\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **TTL** | \`${AZURE_TTL}s\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Provisioning State** | \`${AZURE_PROVISIONING_STATE}\` |" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                
                CONSOLE_URL=$(jq -r '.console_url // empty' dns-record.json)
                if [ -n "${CONSOLE_URL}" ]; then
